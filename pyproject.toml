[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "cartograpy"
version = "1.1.0"
description = "Packages python pour créer des cartes"
authors = [
    { name = "Anicet Cyrille KAMBOU", email = "kanicetcyrille@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "cartopy>=0.23",
    "click>=8.0",
    "geopandas>=0.14",
    "geojson>=3.0",
    "geopy>=2.4",
    "gpxpy>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "osmnx>=1.9",
    "pandas>=2.1",
    "pillow>=10.0",
    "pykml>=0.2",
    "pypalettes>=0.1",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "reportlab>=4.0",
    "requests>=2.31",
    "requests-cache>=1.1",
    "seaborn>=0.13",
    "shapely>=2.0",
    "svglib>=1.5",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "wbdata>=1.0",
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[project.urls]
Homepage = "https://mr-kam.github.io/cartograpy/"
Repository = "https://github.com/mr-kam/cartograpy"
Documentation = "https://mr-kam.github.io/cartograpy/"
"Bug Tracker" = "https://github.com/mr-kam/cartograpy/issues"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "cartograpy*",
]
exclude = [
    "tests*",
]

[tool.setuptools.package-data]
"cartograpy.arrows" = [
    "*",
]

[tool.black]
line-length = 88
target-version = [
    "py37",
]
extend-ignore = [
    "E203",
    "W503",
]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

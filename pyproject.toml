[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "cartograpy"
version = "3.0.0"
description = "Python package to create maps easily"
authors = [
    { name = "Anicet Cyrille KAMBOU", email = "kanicetcyrille@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "cartopy>=0.23",
    "click>=8.0",
    "drawarrow>=0.1",
    "geopandas>=0.14",
    "geojson>=3.0",
    "geopy>=2.4",
    "highlight-text>=0.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pypalettes>=0.1",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "reportlab>=4.0",
    "rlPyCairo>=0.4",
    "requests>=2.31",
    "requests-cache>=1.1",
    "scipy>=1.11",
    "seaborn>=0.13",
    "shapely>=2.0",
    "svglib>=1.5",
    "tqdm>=4.66",
    "matplotlib-map-utils==3.1.2",
    "pyfonts>=1.3.0",
    "scienceplots>=2.1",
    "mplcyberpunk>=0.7",
    "geohexgrid>=3.0",
]

[project.license]
file = "LICENSE"

[project.scripts]
cartograpy = "cartograpy.cli:cli"

[project.optional-dependencies]
osm = [
    "osmnx>=1.9",
]
worldbank = [
    "wbdata>=1.0",
]
gee = [
    "earthengine-api>=1.0",
    "geemap>=0.37.2",
]
stac = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
]
all = [
    "cartograpy[osm,worldbank,gee,stac,webmap]",
]
notebook = [
    "jupyter>=1.1.1",
]
webmap = [
    "folium>=0.15",
    "lonboard>=0.9",
    "keplergl>=0.3.2",
    "rio-tiler>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6",
    "mypy>=1.0.0",
    "jupyterlab>=4.0.0",
]

[project.urls]
Homepage = "https://mr-kam.github.io/cartograpy/"
Repository = "https://github.com/mr-kam/cartograpy"
Documentation = "https://mr-kam.github.io/cartograpy/"
"Bug Tracker" = "https://github.com/mr-kam/cartograpy/issues"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "cartograpy*",
]
exclude = [
    "tests*",
]

[tool.setuptools.package-data]
"cartograpy.arrows" = [
    "*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# availability probes, re-exported to map.py / situation.py via `import *`
"cartograpy/mapper/_optional_deps.py" = ["F401"]
"cartograpy/mapper/{map,situation}.py" = ["F405"]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

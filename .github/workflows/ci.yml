name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Lint source code
        run: flake8 cartograpy/ --max-line-length=120 --extend-ignore=E203,W503 --select=E9,F63,F7,F82
      - name: Lint tests
        run: flake8 test/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=test/situation.py

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgeos-dev libgdal-dev libproj-dev pkg-config
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo geos gdal proj pkg-config
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (versions verrouillées via uv.lock)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --no-sync pytest test/ -v

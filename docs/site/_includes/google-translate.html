<!-- Widget de traduction Google Translate.
     Le conteneur #google_translate_element est déclaré dans le page-footer
     (_quarto.yml) ; ces scripts, injectés en fin de <body>, l'activent. -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'fr',                        // langue d'origine du site
      includedLanguages: 'en,es,de,it,pt,ar,fr', // langues proposées
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
